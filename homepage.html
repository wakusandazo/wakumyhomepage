<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="ノリノリの卑弥呼、ヒウィゴ">

    <title>わくまいぺーじ</title>

    <!-- 共通ヘッダー用CSS -->
    <link rel="stylesheet" href="/wakumyhomepage/common.css">
    <link rel="stylesheet" href="/wakumyhomepage/header.css">

    <style>

        header {
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Poppins", sans-serif;
        }

        body {
            background-color: #00053a;
            color: white;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.2s ease forwards;
            animation-delay: 0.2s;
            font-family: "Poppins", sans-serif;
            margin: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 14px;
            color: white;
            margin-top: 15px;
        }

        .box {
            background-color: #ffffff1a;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 20px;
        }

        .left {
            text-align: left;
        }

        a:link {
            color: #add8e6;
        }

        a:visited {
            color: #add8e6;
        }

    </style>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div id="common-header"></div>

    <!-- このページ固有のタイトル部分 -->
    <header>

        <h1 class="fade-up">

            わくさん<br>

            <span class="subtitle" id="subtitle"></span>

        </h1>

    </header>

    <main>

        <article>

            <div class="box">

                <p>
                    色々まったりやってる人間です。
                </p>

            </div>

            <div class="box center">

                <p>
                    現在進行形でやってること<br>
                    ・osu!taiko<br>
                    ・VRChat<br>
                    <br>

                    過去にやってたこと<br>
                    ・DDLC(日本語翻訳mod) ←気が向いた時にやってます<br>
                    <br>

                    特にやることないので自分のホームページ作ってみました。<br>
                    21の男性というのをやってます。<br>
                    マイペースで更新していきます。特にブログ。<br>
                    気軽に絡んでもらえると喜びます。
                </p>

            </div>

        </article>

    </main>

    <div id="update" style="display:none;">
        アップデートがあります！
    </div>

    <!-- ページ固有のJavaScript -->
    <script>

        const texts = [
            "変な人",
            "おかしな人",
            "夢見がち",
            "ここの文章はページ更新で変わるらしい",
            "",
            "今で何回このサイトに来てくれたかな？",
            "ここにある情報が全てではない",
            "ゆっくりしていってね",
            "絡みたい",
            "ページ更新してくれてありがとう",
            "きっと絡みたくてこのサイトに来たんでしょ？",
            "適当に書いてるだけ",
            "動いてないのに太るよ～",
            "明日には消えているかも",
            "消えちゃうかも",
            "あなたが救いの手？",
            "えへへ～",
            "サヨリだけ",
            "面白いと思ったゲームの翻訳は大体面倒で諦める",
            "またの名を、変態",
            "またの名を、ちんちん侍",
            "きっとキミも同じ人",
            "ここのサイトは基本AIに教えてもらいながら作ってる"
        ];

        const firstMessage = "変な人";

        if (!localStorage.getItem("visited")) {

            document.getElementById("subtitle").textContent = firstMessage;

            localStorage.setItem("visited", "true");

        } else {

            const random = Math.floor(
                Math.random() * texts.length
            );

            document.getElementById("subtitle").textContent = texts[random];

        }


        const currentVersion = "1.0.1";

        const savedVersion = localStorage.getItem("siteVersion");

        if (savedVersion !== currentVersion) {

            document.getElementById("update").style.display = "block";

            localStorage.setItem("siteVersion", currentVersion);

        }

    </script>

    <!-- 共通ヘッダー読み込み用JavaScript -->
    <script src="/wakumyhomepage/header.js"></script>

</body>

</html>
